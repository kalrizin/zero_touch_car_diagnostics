name: Android Release Build

on:
  push:
    branches:
      - release/v1.32.12-beta
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build and rename release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew clean renameReleaseApk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTCDv.1.3.4BETA
          path: build/app/outputs/apk/release/ZTCDv.1.3.4BETA.apk

      - name: Extract release tag from branch name
        id: release_tag
        run: |
          REF="${{ github.ref_name }}"
          echo "tag=${REF#release/}" >> $GITHUB_OUTPUT

      - name: Publish pre-release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ZTCD ${{ steps.release_tag.outputs.tag }}
          prerelease: true
          files: build/app/outputs/apk/release/ZTCDv.1.3.4BETA.apk
