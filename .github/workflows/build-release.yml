name: Build and Publish Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Decode keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "No keystore provided - using debug signing"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d ' ')
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from pubspec.yaml" >&2
            exit 1
          fi
          BUILD_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          if echo "$VERSION" | grep -q '+'; then
            BUILD_NUMBER=$(echo "$VERSION" | cut -d'+' -f2)
          else
            BUILD_NUMBER=1
          fi
          TAG="v${BUILD_NAME}"
          APK_NAME="ZTCD_v${BUILD_NAME}.apk"
          echo "build_name=${BUILD_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-name="${{ steps.version.outputs.build_name }}" --build-number="${{ steps.version.outputs.build_number }}"

      - name: Show build outputs and locate APK
        id: find_apk
        run: |
          echo "PWD: $(pwd)"
          echo "Listing android build outputs..."
          ls -la android/app/build/outputs/flutter-apk || true
          ls -la android/app/build/outputs/apk/release || true
          APK_PATH=$(find android -type f -path '*/build/*' -name '*.apk' | sort | tail -n1 || true)
          echo "Found APK_PATH=$APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in expected locations" >&2
            ls -R android || true
            exit 2
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Ensure version outputs (fallback)
        id: version_fallback
        if: ${{ steps.version.outputs.tag == '' || steps.version.outputs.tag == null }}
        run: |
          echo "No existing version step found or outputs empty; extracting from pubspec.yaml"
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: *//; s/+.*//; s/\r//')
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not extract version from pubspec.yaml" >&2
            exit 1
          fi
          TAG="v$VERSION"
          APK_NAME="ZTCD_${TAG}.apk"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Copy APK to deterministic name and compute checksum
        id: checksum
        run: |
          # Prefer outputs from existing version step if present
          TAG=${{ steps.version.outputs.tag || steps.version_fallback.outputs.tag || '' }}
          APK_NAME=${{ steps.version.outputs.apk_name || steps.version_fallback.outputs.apk_name || '' }}
          if [ -z "$APK_NAME" ]; then
            TAG=${TAG:-v0.0.0}
            APK_NAME="ZTCD_${TAG}.apk"
          fi
          echo "Using TAG=$TAG APK_NAME=$APK_NAME"
          APK_PATH=${{ steps.find_apk.outputs.apk_path }}
          cp "$APK_PATH" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_sha256=$(cut -d' ' -f1 "$APK_NAME.sha256")" >> $GITHUB_OUTPUT

      - name: Upload APK and checksum as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.checksum.outputs.apk_name }}
          path: |
            ${{ steps.checksum.outputs.apk_name }}
            ${{ steps.checksum.outputs.apk_name }}.sha256

      - name: Publish pre-release to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag || steps.version_fallback.outputs.tag }}
          name: ZTCD ${{ steps.version.outputs.tag || steps.version_fallback.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.checksum.outputs.apk_name }}
            ${{ steps.checksum.outputs.apk_name }}.sha256
