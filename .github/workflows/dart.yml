# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Set up Java for Android builds
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Install Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # Verify formatting
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      # Analyze project source
      - name: Analyze project source
        run: flutter analyze

      # Run Flutter tests
      - name: Run tests
        run: flutter test

      # Decode keystore for release signing (if provided)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "No keystore provided - using debug signing"
          fi

      # Extract version from pubspec.yaml
      - name: Extract version
        id: version
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d ' ')
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from pubspec.yaml" >&2
            exit 1
          fi
          BUILD_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          if echo "$VERSION" | grep -q '+'; then
            BUILD_NUMBER=$(echo "$VERSION" | cut -d'+' -f2)
          else
            BUILD_NUMBER=1
          fi
          TAG="v${BUILD_NAME}"
          APK_NAME="ZTCD_v${BUILD_NAME}.apk"
          echo "build_name=${BUILD_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      # Build release APK
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-name="${{ steps.version.outputs.build_name }}" --build-number="${{ steps.version.outputs.build_number }}"

      # Rename APK to include version
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.apk_name }}"

      # Upload APK as workflow artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ steps.version.outputs.apk_name }}

      # Publish APK as GitHub Release (only on push to main)
      - name: Publish release APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ZTCD ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.version.outputs.apk_name }}
